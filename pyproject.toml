[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "signedhook"
version = "1.2.0"
description = "Verify signed webhooks from Standard Webhooks, Stripe, GitHub (SHA-256 + legacy SHA-1), Slack, Shopify, Razorpay, Twilio and custom schemes with one call - zero dependencies, streaming verification, sync and async replay protection."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Odyntiq" }]
keywords = [
  "webhooks",
  "webhook",
  "signature",
  "hmac",
  "verification",
  "stripe",
  "github",
  "slack",
  "shopify",
  "razorpay",
  "twilio",
  "standard-webhooks",
  "svix",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
flask = ["flask>=3.0"]
django = ["django>=4.2"]
redis = ["redis>=4.5"]
aiosqlite = ["aiosqlite>=0.20"]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.13",
  "build>=1.2",
  "twine>=6",
  "pip-audit>=2.7",
  "fastapi>=0.110",
  "httpx>=0.27",
  "flask>=3.0",
  "django>=4.2",
  "aiosqlite>=0.20",
]

[project.scripts]
signedhook = "signedhook.cli:main"

[project.urls]
Homepage = "https://github.com/Odyntiq/signedhook"
Repository = "https://github.com/Odyntiq/signedhook"
Changelog = "https://github.com/Odyntiq/signedhook/blob/main/CHANGELOG.md"
Security = "https://github.com/Odyntiq/signedhook/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signedhook = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
show_error_codes = true

[[tool.mypy.overrides]]
# Django ships no inline types (django-stubs is a separate project); the
# integration module annotates everything itself and only uses a small,
# stable slice of the framework.
module = ["django.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["signedhook"]
